plugins {
    id 'java'
    id 'idea'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.springframework.boot' version '4.1.1' apply false
    id 'com.bakdata.gradle.avro' version '2.0.1' apply false
}

group 'com.ashu.practice'
version "$appVersion"


subprojects {
    apply plugin: 'java'
    apply plugin: 'idea'
    apply plugin: 'io.spring.dependency-management'

    java {
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }


    dependencyManagement {
        imports {
            mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
        }
        dependencies {
            dependency "org.springdoc:springdoc-openapi-starter-webmvc-ui:$springdocOpenapiVersion"
            dependency "io.swagger.core.v3:swagger-annotations:$swaggerAnnotationsVersion"
            dependency "org.apache.avro:avro:$apacheAvroVersion"
            dependency "io.confluent:kafka-avro-serializer:$kafkaAvroSerializerVersion"
            dependency "io.confluent:kafka-streams-avro-serde:$kafkaAvroSerializerVersion"
            dependency "net.datafaker:datafaker:$datafakerVersion"
        }

    }

    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }
    }

    idea {
        module {
            downloadJavadoc = true
            downloadSources = true
        }
    }

    plugins.withId('org.springframework.boot') {
        tasks.named('bootRun') {
            jvmArgs '-Dorg.apache.avro.SERIALIZABLE_PACKAGES=com.ashu.practice.common.model'
        }
        tasks.register('docker', Exec) {
            group = 'docker'
            description = "Build the ${project.name} Docker image"
            dependsOn tasks.named('bootJar')
            workingDir project.projectDir
            commandLine 'docker', 'build',
                    '--build-arg', "VERSION=${rootProject.version}",
                    '-t', "ashutoshsahoo/${project.name}:latest",
                    '.'
        }
        tasks.register('dockerTag') {
            group = 'docker'
            description = "Tag the ${project.name} Docker image"
            dependsOn 'docker'
        }
    }
}

tasks.register('dockerTag') {
    group = 'docker'
    description = 'Build Docker images for all Spring Boot services'
    dependsOn ':order-service:dockerTag', ':payment-service:dockerTag', ':stock-service:dockerTag'
}
