# Confluent Kafka + Schema Registry + Kafka UI
apiVersion: v1
kind: Namespace
metadata:
  name: kafka

---
# ============================================================
# Kafka Broker 0
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: kafka-0
  namespace: kafka
spec:
  clusterIP: None
  selector:
    app: kafka
    broker: "0"
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-0-data
  namespace: kafka
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
# ============================================================
# Kafka Broker 1
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: kafka-1
  namespace: kafka
spec:
  clusterIP: None
  selector:
    app: kafka
    broker: "1"
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-1-data
  namespace: kafka
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
# ============================================================
# Kafka Broker 2
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: kafka-2
  namespace: kafka
spec:
  clusterIP: None
  selector:
    app: kafka
    broker: "2"
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-2-data
  namespace: kafka
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
# ============================================================
# Kafka 0
# ============================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka-0
  namespace: kafka
spec:
  serviceName: kafka-0
  replicas: 1
  selector:
    matchLabels:
      app: kafka
      broker: "0"

  template:
    metadata:
      labels:
        app: kafka
        broker: "0"

    spec:
      hostname: kafka-0

      containers:
        - name: kafka
          image: confluentinc/cp-server:8.3.1

          ports:
            - containerPort: 9092
              name: kafka
            - containerPort: 9093
              name: controller

          env:
            - name: KAFKA_NODE_ID
              value: "0"

            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"

            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "0@kafka-0.kafka.svc.cluster.local:9093,1@kafka-1.kafka.svc.cluster.local:9093,2@kafka-2.kafka.svc.cluster.local:9093"

            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"

            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka-0.kafka.svc.cluster.local:9092"

            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"

            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"

            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"

            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data"

            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "3"

            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "3"

            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "2"

            - name: KAFKA_DEFAULT_REPLICATION_FACTOR
              value: "3"

            - name: KAFKA_MIN_INSYNC_REPLICAS
              value: "2"

            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"

            - name: KAFKA_CONFLUENT_SUPPORT_CUSTOMER_ID
              value: "anonymous"

            - name: KAFKA_CONFLUENT_LICENSE_TOPIC_REPLICATION_FACTOR
              value: "3"

            - name: KAFKA_CONFLUENT_BALANCER_TOPIC_REPLICATION_FACTOR
              value: "3"

            - name: KAFKA_JMX_PORT
              value: "9999"

            - name: CLUSTER_ID
              value: "MkU3OEVBNTcwNTJENDM2Qk"

          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data

      volumes:
        - name: kafka-data
          persistentVolumeClaim:
            claimName: kafka-0-data

