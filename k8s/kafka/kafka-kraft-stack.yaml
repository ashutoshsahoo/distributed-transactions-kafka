# ============================================================
# Schema Registry
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: schema-registry
  namespace: kafka
spec:
  selector:
    app: schema-registry
  ports:
    - name: http
      port: 8081
      targetPort: 8081

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: schema-registry
  namespace: kafka
spec:
  replicas: 1

  selector:
    matchLabels:
      app: schema-registry

  template:
    metadata:
      labels:
        app: schema-registry

    spec:
      # Avoid K8s injecting SCHEMA_REGISTRY_PORT (conflicts with the Confluent image).
      enableServiceLinks: false
      containers:
        - name: schema-registry
          image: confluentinc/cp-schema-registry:8.3.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
          env:
            # Schema Registry HTTP server
            - name: SCHEMA_REGISTRY_HOST_NAME
              value: "schema-registry"

            - name: SCHEMA_REGISTRY_LISTENERS
              value: "http://0.0.0.0:8081"

            # IMPORTANT:
            # Use PLAINTEXT, NOT INTERNAL
            - name: SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS
              value: "PLAINTEXT://kafka-0.kafka.svc.cluster.local:9092,PLAINTEXT://kafka-1.kafka.svc.cluster.local:9092,PLAINTEXT://kafka-2.kafka.svc.cluster.local:9092"

            - name: SCHEMA_REGISTRY_KAFKASTORE_SECURITY_PROTOCOL
              value: "PLAINTEXT"

            - name: SCHEMA_REGISTRY_KAFKASTORE_TOPIC
              value: "_schemas"

            - name: SCHEMA_REGISTRY_SCHEMA_REGISTRY_GROUP_ID
              value: "schema-registry"

          readinessProbe:
            httpGet:
              path: /subjects
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12

          livenessProbe:
            httpGet:
              path: /subjects
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6

---
# ============================================================
# Kafka UI
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  namespace: kafka
spec:
  type: NodePort

  selector:
    app: kafka-ui

  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30001

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: kafka
spec:
  replicas: 1

  selector:
    matchLabels:
      app: kafka-ui

  template:
    metadata:
      labels:
        app: kafka-ui

    spec:
      containers:
        - name: kafka-ui
          image: provectuslabs/kafka-ui:latest

          ports:
            - containerPort: 8080

          env:
            - name: DYNAMIC_CONFIG_ENABLED
              value: "false"

            # ------------------------------------------------
            # Kafka Cluster
            # ------------------------------------------------
            - name: KAFKA_CLUSTERS_0_NAME
              value: "confluent-kafka"

            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: "kafka-0.kafka.svc.cluster.local:9092,kafka-1.kafka.svc.cluster.local:9092,kafka-2.kafka.svc.cluster.local:9092"

            # ------------------------------------------------
            # Schema Registry
            # ------------------------------------------------
            - name: KAFKA_CLUSTERS_0_SCHEMAREGISTRY
              value: "http://schema-registry.kafka.svc.cluster.local:8081"

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20